<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutoriales · Gighopp System</title>
<meta name="description" content="Videos cortos para usar tu Gighopp System y sacarle más provecho a tus campañas.">
<meta property="og:title" content="Tutoriales · Gighopp System">
<meta property="og:description" content="Videos cortos, paso a paso, para usar tu CRM y alimentar tus campañas.">
<meta property="og:image" content="https://presentaciones.gighoppmarketing.com/tutoriales/mover-leads/a/poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><b>Gighopp</b><span>Centro de tutoriales</span></div>
  <h1>Aprende a usar tu <mark>Gighopp System</mark></h1>
  <p class="lede">Videos cortos, paso a paso. Busca el tema que necesitas y dale play. Vamos agregando tutoriales nuevos aquí.</p>
  <div class="search"><input id="q" type="search" placeholder="Busca un tema: citas, descalificado, calendario…" aria-label="Buscar tutorial"></div>
</div></header>
<main class="wrap" id="lista"></main>
<p class="wrap empty" id="empty">No encontramos ese tema todavía. Escríbele a Luis y lo armamos.</p>
<footer><div class="wrap"><span><b>Gighopp</b> · Centro de tutoriales</span><span>¿Dudas? Escríbele a Luis</span></div></footer>
<script src="tutoriales.js"></script>
<script>
(function(){
  var L=window.TUTORIALES||[], main=document.getElementById('lista'), q=document.getElementById('q'), empty=document.getElementById('empty');
  function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
  function render(term){
    var t=norm(term), temas={}, n=0;
    L.forEach(function(x){
      var hay=norm(x.titulo+' '+x.corto+' '+x.tema+' '+x.claves);
      if(t && hay.indexOf(t)<0) return;
      (temas[x.tema]=temas[x.tema]||[]).push(x); n++;
    });
    main.innerHTML=Object.keys(temas).map(function(k){
      return '<section class="topic"><span class="tag">'+k+'</span><div class="grid">'+temas[k].map(function(x){
        return '<a class="card" href="'+x.slug+'/"><div class="th"><img src="'+x.img+'" alt="" loading="lazy"><span>'+x.duracion+'</span></div>'+
               '<div class="bd"><small>'+x.tema+'</small><h3>'+x.titulo+'</h3><p>'+x.corto+'</p></div></a>';
      }).join('')+'</div></section>';
    }).join('');
    empty.style.display=n?'none':'block';
  }
  q.addEventListener('input',function(){render(q.value)});
  render('');
})();
</script>
</body>
</html>
